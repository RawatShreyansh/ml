[project]
name = "logreg"
version = "0.1.0"
description = "Logistic regression from scratch, with the math."
readme = "README.md"
authors = [
    { name = "RawatShreyansh", email = "rawat.shreyansh09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "nbstripout>=0.9.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","N","NPY","SIM"]

[tool.mypy]
strict=true
python_version = "3.12"
files = ["src","tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=logreg --cov-report=term-missing"
filterwarnings = ["error"]
